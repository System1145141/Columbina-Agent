<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Columbina · IDE</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
  <link rel="stylesheet" href="../ui/fonts.css" />
  <link rel="stylesheet" href="../ui/base.css" />
  <link rel="stylesheet" href="./ide.css" />
</head>
<body>
  <div class="ide">
    <header class="ide__titlebar">
      <div class="ide__titlebar-drag">
        <span class="ide__logo">Columbina IDE</span>
        <button type="button" class="ide__btn" id="open-folder-btn">打开文件夹</button>
        <button type="button" class="ide__btn" id="add-folder-btn" title="添加文件夹到工作区">+</button>
        <button type="button" class="ide__btn" id="terminal-toggle-btn" title="切换终端 (Ctrl+`)">终端</button>
        <button type="button" class="ide__btn" id="ai-toggle-btn" title="切换 AI 面板">AI</button>
        <span class="ide__folder" id="folder-path"></span>
      </div>
      <div class="ide__titlebar-actions">
        <button type="button" class="ide__winbtn" id="min-btn" aria-label="最小化">—</button>
        <button type="button" class="ide__winbtn" id="max-btn" aria-label="最大化">□</button>
        <button type="button" class="ide__winbtn ide__winbtn--close" id="close-btn" aria-label="关闭">×</button>
      </div>
    </header>
    <div class="ide__workspace">
      <aside class="ide__sidebar" id="file-tree">
        <div class="ide__sidebar-header">
          <span class="ide__sidebar-title" id="sidebar-title">资源管理器</span>
          <div class="ide__sidebar-actions">
            <button type="button" class="ide__sidebar-action" id="search-toggle-btn" title="在文件夹中搜索 (Ctrl+Shift+F)">🔍</button>
            <button type="button" class="ide__sidebar-action" id="problems-toggle-btn" title="问题面板 (Ctrl+Shift+M)">⚠</button>
            <button type="button" class="ide__sidebar-action" id="outline-toggle-btn" title="大纲 (Ctrl+Shift+O)">☰</button>
            <button type="button" class="ide__sidebar-action" id="git-toggle-btn" title="源代码管理">🌿</button>
          </div>
        </div>
        <div class="ide__search" id="search-panel" style="display: none;">
          <div class="ide__search-input-row">
            <input type="text" class="ide__search-input" id="search-input" placeholder="搜索" />
            <button type="button" class="ide__search-replace-toggle" id="search-replace-toggle" title="切换替换模式">⬅</button>
          </div>
          <div class="ide__search-replace-row" id="search-replace-row" style="display: none;">
            <input type="text" class="ide__search-input" id="search-replace-input" placeholder="替换为" />
          </div>
          <div class="ide__search-options">
            <label><input type="checkbox" id="search-case" /> 区分大小写</label>
            <label><input type="checkbox" id="search-word" /> 全词匹配</label>
            <label><input type="checkbox" id="search-regex" /> 正则</label>
          </div>
          <div class="ide__search-roots" id="search-roots"></div>
          <button type="button" class="ide__search-back" id="search-back-btn">← 返回资源管理器</button>
          <div class="ide__search-results" id="search-results"></div>
        </div>
        <div class="ide__problems" id="problems-panel" style="display: none;">
          <div class="ide__problems-header">
            <span class="ide__problems-title">问题</span>
            <span class="ide__problems-count" id="problems-count"></span>
            <button type="button" class="ide__problems-clear" id="problems-clear-btn" title="清空所有问题" aria-label="清空所有问题">×</button>
          </div>
          <div class="ide__problems-list" id="problems-list"></div>
        </div>
        <div class="ide__outline" id="outline-panel" style="display: none;">
          <div class="ide__outline-header">
            <span>大纲</span>
            <span class="ide__outline-file" id="outline-file" title=""></span>
          </div>
          <div class="ide__outline-list" id="outline-list"></div>
        </div>
        <div class="ide__git" id="git-panel" style="display: none;">
          <div class="ide__git-header">
            <span>源代码管理</span>
            <button type="button" class="ide__git-refresh" id="git-refresh-btn" title="刷新">↻</button>
          </div>
          <div class="ide__git-roots" id="git-roots"></div>
          <div class="ide__git-loading" id="git-loading" style="display: none;">
            <span class="ide__git-spinner"></span>
            <span>加载中...</span>
          </div>
          <div class="ide__git-diff" id="git-diff-box" style="display: none;">
            <div class="ide__git-diff-header">
              <span class="ide__git-diff-path" id="git-diff-path"></span>
              <div class="ide__git-diff-actions">
                <button type="button" class="ide__git-diff-open" id="git-open-diff" title="打开文件">打开</button>
                <button type="button" class="ide__git-diff-open" id="git-open-diff-tab" title="在新标签页中并排对比变更">并排对比</button>
                <button type="button" class="ide__git-diff-close" id="git-diff-close" title="关闭">×</button>
              </div>
            </div>
            <div class="ide__git-diff-content" id="git-diff-content"></div>
          </div>
        </div>
        <div class="ide__tree" id="tree-root"></div>
      </aside>
      <main class="ide__main">
        <div class="ide__tabbar" id="tab-bar"></div>
        <div class="ide__editor" id="editor"></div>
        <div class="ide__terminal" id="terminal-panel" style="display: none;">
          <div class="ide__terminal-header">
            <div class="ide__terminal-tabs" id="terminal-tabs"></div>
            <div class="ide__terminal-actions">
              <button type="button" class="ide__terminal-add" id="terminal-add-btn" title="新建终端" aria-label="新建终端">+</button>
              <button type="button" class="ide__terminal-close" id="terminal-close-btn" aria-label="关闭终端">×</button>
            </div>
          </div>
          <div class="ide__terminal-content" id="terminal-content"></div>
        </div>
      </main>
      <aside class="ide__ai-panel" id="ai-panel" style="display: none;">
        <div class="ide__ai-header">
          <span>Columbina AI</span>
          <div class="ide__ai-header-actions">
            <button type="button" class="ide__ai-header-btn" id="ai-session-btn" title="会话管理（切换 / 新建 / 复制 / 重命名 / 删除）">▾ 会话</button>
            <button type="button" class="ide__ai-header-btn" id="ai-undo-btn" title="撤销上次修改" disabled>撤销</button>
            <button type="button" class="ide__ai-close" id="ai-close-btn" aria-label="关闭 AI 面板">×</button>
          </div>
        </div>
        <div class="ide__ai-messages" id="ai-messages"></div>
        <div class="ide__ai-input-area">
          <div class="ide__ai-context-row">
            <div class="ide__ai-context">
              <label class="ide__ai-context-label">模型:</label>
              <select id="ai-model-select" class="ide__ai-context-select" title="选择当前身份使用的模型"></select>
            </div>
            <div class="ide__ai-context">
              <label class="ide__ai-context-label">上下文:</label>
              <select id="ai-context-select" class="ide__ai-context-select">
                <option value="file">当前文件</option>
                <option value="selection">当前选区</option>
                <option value="project">整个项目</option>
                <option value="git">Git 变更</option>
              </select>
            </div>
          </div>
          <div class="ide__ai-input-row">
            <textarea id="ai-input" class="ide__ai-input" placeholder="询问关于代码的问题..." rows="2"></textarea>
            <button type="button" class="ide__ai-send" id="ai-send-btn">发送</button>
          </div>
        </div>
      </aside>
    </div>
    <footer class="ide__statusbar" id="status-bar">
      <span class="ide__statusbar-left" id="status-left"></span>
      <span class="ide__statusbar-right" id="status-right"></span>
    </footer>
  </div>
  <div class="ide__command" id="command-panel" style="display: none;">
    <div class="ide__command-box">
      <input type="text" class="ide__command-input" id="command-input" placeholder="键入命令或搜索文件" autocomplete="off" />
      <div class="ide__command-list" id="command-list"></div>
      <div class="ide__command-hint">
        <span>↑↓ 选择</span>
        <span>↵ 执行</span>
        <span>Esc 关闭</span>
      </div>
    </div>
  </div>
  <div class="ide__prompt-overlay" id="prompt-overlay" style="display: none;">
    <div class="ide__prompt-box">
      <label class="ide__prompt-label" id="prompt-label"></label>
      <input type="text" class="ide__prompt-input" id="prompt-input" autocomplete="off" />
      <div class="ide__prompt-actions">
        <button type="button" class="ide__prompt-btn ide__prompt-btn--primary" id="prompt-ok-btn">确定</button>
        <button type="button" class="ide__prompt-btn" id="prompt-cancel-btn">取消</button>
      </div>
    </div>
  </div>
  <script type="module" src="./ide-main.ts"></script>
</body>
</html>
