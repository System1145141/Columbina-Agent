name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # 与 package.json engines 一致
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (main + preload + renderer)
        run: npm run build

      - name: Typecheck renderer
        run: npm run typecheck:renderer

      - name: Unit tests
        run: npm test
