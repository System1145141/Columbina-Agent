name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # 与 package.json engines 一致
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & package
        run: npm run dist           # build:main + build:preload + build:renderer + electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 无签名证书时跳过 mac 签名

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
